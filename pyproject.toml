[project]
name = "takehome-challenge-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Andres Triana", email = "andres.010192@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.142.2",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "sqlalchemy[asyncio]>=2.1.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
